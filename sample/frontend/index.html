<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CL</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 顶部栏 -->
<div class="top-bar">
  <span class="top-bar-label">CL</span>
  <div class="top-bar-drag"></div>
  <div class="top-bar-btns">
    <button class="ctrl-btn btn-blue" aria-label="最小化" title="最小化"></button>
    <button class="ctrl-btn btn-red" aria-label="关闭" title="关闭"></button>
  </div>
</div>

<!-- ===== 第一层：登录阶段 ===== -->
<div class="layer layer-login" id="layerLogin">
  <div class="login-hint" id="loginHint">请登录一个账号以开始使用</div>
  <div class="login-card" id="loginCard">
    <img class="login-avatar" id="loginAvatar" src="../resoures/icon/nukownP.png" alt="登录头像">
    <div class="login-input-group">
      <input type="text" class="login-input" id="loginInput" placeholder="输入您的 ID">
    </div>
    <button class="login-btn" id="loginBtn">登录</button>
  </div>
</div>

<!-- ===== 第二层：过渡动画层 ===== -->
<div class="layer layer-transition" id="layerTransition">
  <img class="transition-img" id="transitionImg" src="../resoures/icon/door_offi.png" alt="过渡动画">
</div>

<!-- ===== 第三层：大厅（后续内容） ===== -->
<div class="layer layer-lobby" id="layerLobby">
  <div class="lobby-sidebar" id="lobbySidebar">
    <div class="sidebar-icons">
      <button type="button" class="sidebar-icon active" data-tab="home" data-tip="主页" aria-label="主页">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </button>
      <button type="button" class="sidebar-icon" data-tab="download" data-tip="下载" aria-label="下载">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
      <button type="button" class="sidebar-icon" data-tab="resource" data-tip="资源管理" aria-label="资源管理">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      </button>
      <button type="button" class="sidebar-icon" data-tab="online" data-tip="联机" aria-label="联机">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      </button>
      <button type="button" class="sidebar-icon" data-tab="settings" data-tip="设置" aria-label="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <button type="button" class="sidebar-icon" data-tab="help" data-tip="帮助" aria-label="帮助">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      </button>
    </div>
  </div>

  <!-- 主页内容 -->
  <div class="lobby-main home-page" id="homePage">
    <!-- 游戏版本选择卡片 -->
    <div class="version-card" id="versionCard">
      <div class="version-card-expand" id="versionCardExpand">
        <div class="version-card-expand-content">
          <div class="version-card-list" id="versionCardList">
          </div>
        </div>
      </div>
      <button type="button" class="version-card-main" id="versionCardMain" aria-expanded="false">
        <img class="version-card-icon" src="../resoures/icon/grass_block_side.png" alt="版本图标">
        <span class="version-card-name" id="versionCardName">选择版本</span>
      </button>
    </div>

    <!-- 开始游戏按钮 -->
    <button class="start-game-btn" id="startGameBtn">开始游戏</button>

    <!-- 角色信息卡片 -->
    <div class="account-card" id="accountCard">
      <div class="account-card-expand" id="accountCardExpand">
        <div class="account-card-expand-content">
          <button class="account-manage-btn" id="accountManageBtn">管理账户</button>
          <div class="account-card-list" id="accountCardList">
          </div>
        </div>
      </div>
      <button type="button" class="account-card-main" id="accountCardMain" aria-expanded="false">
        <img class="account-card-avatar" id="accountCardAvatar" src="../resoures/icon/nukownP.png" alt="账户头像">
        <span class="account-card-name" id="accountCardName">未登录</span>
      </button>
    </div>
  </div>

  <!-- 资源管理页内容 -->
  <div class="lobby-main resource-page" id="resourcePage">
    <div class="sub-sidebar" id="resourceSubSidebar">
      <button type="button" class="sub-sidebar-item active" data-category="versions">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        <span>版本</span>
      </button>
    </div>
    <div class="resource-content" id="resourceContent">
      <div class="download-loading">
        <p>请选择分类</p>
      </div>
    </div>
  </div>

  <!-- 下载页内容 -->
  <div class="lobby-main download-page" id="downloadPage">
    <!-- 下载页副导航栏 -->
    <div class="sub-sidebar" id="subSidebar">
      <button type="button" class="sub-sidebar-item active" data-category="game">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M12 12h.01"/><path d="M17 12h.01"/><path d="M7 12h.01"/></svg>
        <span>原版游戏</span>
      </button>
      <button type="button" class="sub-sidebar-item" data-category="mods">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
        <span>Mod</span>
      </button>
      <button type="button" class="sub-sidebar-item" data-category="resourcepack">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        <span>资源包</span>
      </button>
      <button type="button" class="sub-sidebar-item" data-category="shaderpack">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <span>光影包</span>
      </button>
    </div>

    <!-- 下载页主内容区 -->
    <div class="download-content" id="downloadContent">
      <div class="download-loading">
        <div class="download-spinner"></div>
        <p>选择分类查看内容</p>
      </div>
    </div>
  </div>

  <!-- 设置页内容 -->
  <div class="lobby-main settings-page" id="settingsPage">
    <!-- 设置页副导航栏 -->
    <div class="sub-sidebar" id="settingsSubSidebar">
      <button type="button" class="sub-sidebar-item active" data-category="general">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>启动器</span>
      </button>
      <button type="button" class="sub-sidebar-item" data-category="version">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span>下载设置</span>
      </button>
      <button type="button" class="sub-sidebar-item" data-category="ignore">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        <span>忽略</span>
      </button>
      <button type="button" class="sub-sidebar-item" data-category="account">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>角色</span>
      </button>
    </div>

    <!-- 设置页主内容区 -->
    <div class="settings-content" id="settingsContent">
      <div class="download-loading">
        <p>请选择设置项</p>
      </div>
    </div>
  </div>
</div>

<div class="custom-tooltip" id="customTooltip"></div>

<!-- 消息提示框容器 -->
<div class="notification-container" id="notificationContainer"></div>

<script src="js/app.js"></script>
</body>
</html>
